<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>لوحة إدارة المرصد الإفريقي</title>

  <script src="https://unpkg.com/@sveltia/cms/dist/sveltia-cms.js"></script>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      color: #17202a;
    }

    .topbar {
      background: #071d33;
      color: white;
      padding: 18px 20px;
      text-align: center;
    }

    .topbar h1 {
      margin: 0;
      font-size: 24px;
    }

    .topbar p {
      margin: 6px 0 0;
      color: #d8b45a;
    }

    .notice {
      max-width: 900px;
      margin: 30px auto;
      background: white;
      padding: 25px;
      border-radius: 10px;
      box-shadow: 0 3px 15px rgba(0,0,0,0.08);
      text-align: center;
    }

    .notice h2 {
      color: #071d33;
    }

    .notice p {
      line-height: 1.8;
    }
  </style>
</head>

<body>

  <div class="topbar">
    <h1>المرصد الإفريقي للأمن والدفاع</h1>
    <p>لوحة إدارة المقالات الاستراتيجية</p>
  </div>

  <div class="notice">
    <h2>لوحة الإدارة</h2>

    <p>
      سيتم استخدام هذه الصفحة لإضافة المقالات الاستراتيجية
      وتعديلها وحذفها.
    </p>

    <p>
      إذا ظهرت لك هذه الصفحة بشكل صحيح، فهذا يعني أن
      مجلد الإدارة يعمل بنجاح.
    </p>
  </div>

</body>
</html>
