name: Generate Daily Cards

on:
  workflow_dispatch:
    inputs:
      slot:
        description: "Daily card (use daily)"
        required: false
        default: "daily"

  schedule:
    # Tunisia local time: every 45 minutes from 06:00 through 15:45.
    # The minute/hour combinations preserve a true 45-minute cadence.
    - cron: "0,45 6,9,12,15 * * *"
      timezone: "Africa/Tunis"
    - cron: "30 7,10,13 * * *"
      timezone: "Africa/Tunis"
    - cron: "15 8,11,14 * * *"
      timezone: "Africa/Tunis"

    # Evening refreshes every two hours, followed by the final 23:50 update.
    - cron: "0 16,18,20,22 * * *"
      timezone: "Africa/Tunis"
    - cron: "50 23 * * *"
      timezone: "Africa/Tunis"

permissions:
  contents: write

concurrency:
  group: daily-security-cards-v2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate-card:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Refresh checkout to latest main
        run: |
          git fetch origin main
          git checkout -B main origin/main
          git reset --hard origin/main

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Gemini SDK
        run: |
          python -m pip install --upgrade pip
          pip install google-genai
          python -c "import google.genai; print('google-genai installed successfully')"
          pip show google-genai

      - name: Generate daily card
        timeout-minutes: 4
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CARD_SLOT: ${{ inputs.slot || 'daily' }}
        run: |
          python -u daily_cards/generate_daily_card.py

      - name: Verify today's card contains at least one event
        run: |
          python - <<'PY'
          import json
          from datetime import datetime
          from pathlib import Path
          from zoneinfo import ZoneInfo

          today = datetime.now(ZoneInfo("Africa/Tunis")).date().isoformat()
          path = Path("daily_cards/cards.json")
          if not path.exists():
              raise SystemExit("Daily card file is missing; refusing to publish.")
          data = json.loads(path.read_text(encoding="utf-8"))
          cards = data.get("cards", []) if isinstance(data, dict) else []
          card = next((c for c in reversed(cards)
                       if c.get("date") == today and c.get("slot") == "daily"), None)
          if not card:
              raise SystemExit(f"No daily card exists for {today}; refusing to publish.")
          count = sum(
              1 for section in card.get("sections", [])
              for event in section.get("events", [])
              if isinstance(event, dict) and str(event.get("text", "")).strip()
          )
          print(f"Today's published-event count: {count}")
          if count < 1:
              raise SystemExit("Today's card is empty; refusing to publish it.")
          PY

      - name: Commit and push card
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add daily_cards/cards.json daily_cards/archive

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update daily security card"
            for attempt in 1 2 3; do
              if git pull --rebase origin main && git push origin main; then exit 0; fi
              git rebase --abort || true
              echo "Push attempt $attempt failed; retrying after refreshing main."
              sleep 2
            done
            exit 1
          fi
