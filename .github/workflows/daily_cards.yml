name: Generate Daily Cards

on:
  workflow_dispatch:
    inputs:
      slot:
        description: "Daily card (use daily)"
        required: false
        default: "daily"

  schedule:
    # Create the single daily card at 06:00, Tunisia time.
    - cron: "0 6 * * *"
      timezone: "Africa/Tunis"

    # Refresh it hourly after the news feed has had time to update.
    - cron: "10 6-23 * * *"
      timezone: "Africa/Tunis"

    # Final refresh close to midnight.
    - cron: "59 23 * * *"
      timezone: "Africa/Tunis"

permissions:
  contents: write

jobs:
  generate-card:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Refresh checkout to latest main
        run: |
          git fetch origin main
          git checkout -B main origin/main
          git reset --hard origin/main

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Gemini SDK
        run: |
          python -m pip install --upgrade pip
          pip install google-genai
          python -c "import google.genai; print('google-genai installed successfully')"
          pip show google-genai

      - name: Generate daily card
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CARD_SLOT: ${{ inputs.slot || 'daily' }}
        run: |
          python -u daily_cards/generate_daily_card.py

      - name: Commit and push card
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add daily_cards/cards.json daily_cards/archive

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update daily security card"
            for attempt in 1 2 3; do
              git pull --rebase origin main && git push origin main && exit 0
              echo "Push attempt $attempt failed; retrying after refreshing main."
              sleep 2
            done
            exit 1
          fi
