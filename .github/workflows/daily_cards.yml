name: Generate Daily Cards

on:
  workflow_dispatch:
    inputs:
      slot:
        description: "Card slot: 05, 16, or 21"
        required: false
        default: ""

  schedule:
    - cron: "0 5 * * *"
      timezone: "Africa/Tunis"

    - cron: "0 16 * * *"
      timezone: "Africa/Tunis"

    - cron: "0 21 * * *"
      timezone: "Africa/Tunis"

permissions:
  contents: write

jobs:
  generate-card:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Gemini SDK
        run: |
          python -m pip install --upgrade pip
          pip install google-genai

      - name: Generate daily card
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CARD_SLOT: ${{ inputs.slot }}
        run: |
          python -u daily_cards/generate_daily_card.py

      - name: Commit and push card
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add daily_cards/cards.json daily_cards/archive

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update daily security card"
            git push
          fi
