name: Generate Daily Cards

on:
  workflow_dispatch:
    inputs:
      slot:
        description: "Daily card (use daily)"
        required: false
        default: "daily"
      force_refresh:
        description: "Force a refresh even when today's source packet is unchanged"
        required: false
        type: boolean
        default: false

  # Run a forced verification refresh when the card generator or its
  # workflow changes. Generated card-data commits do not match these paths,
  # so this cannot create a self-triggering loop.
  # Touching this workflow also re-registers its scheduled trigger on main.
  push:
    branches:
      - main
    paths:
      - "daily_cards/generate_daily_card.py"
      - ".github/workflows/daily_cards.yml"

  schedule:
    # Refresh the news digest every 30 minutes at :20 and :50 Tunis time.
    # Keep this schedule on the default branch and verify each scheduled cycle.
    - cron: "20,50 * * * *"
      timezone: "Africa/Tunis"

permissions:
  contents: write

concurrency:
  group: daily-security-cards-v2-${{ github.ref }}
  # Let an active generation finish; a newer scheduled run must not cancel it.
  cancel-in-progress: false

jobs:
  generate-card:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Refresh checkout to latest main
        run: |
          git fetch origin main
          git checkout -B main origin/main
          git reset --hard origin/main

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Gemini SDK
        run: |
          python -m pip install --upgrade pip
          pip install google-genai
          python -c "import google.genai; print('google-genai installed successfully')"
          pip show google-genai

      - name: Generate daily card
        timeout-minutes: 4
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-3.5-flash-lite
          CARD_SLOT: ${{ inputs.slot || 'daily' }}
          FORCE_CARD_REFRESH: ${{ github.event_name == 'push' || inputs.force_refresh || 'false' }}
        run: |
          python -u daily_cards/generate_daily_card.py

      - name: Verify today's card is fresh, structured, and non-empty
        run: |
          python - <<'PY'
          import json
          from datetime import datetime
          from daily_cards.generate_daily_card import (
              normalize_country_for_match, normalize_event_for_match, same_event_text
          )
          from pathlib import Path
          from zoneinfo import ZoneInfo

          today = datetime.now(ZoneInfo("Africa/Tunis")).date().isoformat()
          path = Path("daily_cards/cards.json")
          if not path.exists():
              raise SystemExit("Daily card file is missing; refusing to publish.")
          data = json.loads(path.read_text(encoding="utf-8"))
          cards = data.get("cards", []) if isinstance(data, dict) else []
          card = next((c for c in reversed(cards)
                       if c.get("date") == today and c.get("slot") == "daily"), None)
          if not card:
              raise SystemExit(f"No daily card exists for {today}; refusing to publish.")
          if not card.get("source_fingerprint"):
              raise SystemExit("Card has no source fingerprint; refusing to publish.")
          if not card.get("generated_at"):
              raise SystemExit("Card has no generation timestamp; refusing to publish.")

          sections = card.get("sections", [])
          expected = {
              "libya", "algeria", "morocco", "africa_major", "terrorism",
              "middle_east", "international_orgs", "world_major"
          }
          actual = {s.get("id") for s in sections if isinstance(s, dict)}
          missing = expected - actual
          if missing:
              raise SystemExit(f"Card is missing expected sections: {sorted(missing)}")

          seen = []
          duplicates = []
          for section in sections:
              for event in section.get("events", []):
                  if not isinstance(event, dict):
                      continue
                  value = str(event.get("text", "")).strip()
                  if not value:
                      continue
                  country = normalize_country_for_match(event.get("country", ""))
                  for prior_country, prior_text in seen:
                      if normalize_event_for_match(value) == normalize_event_for_match(prior_text):
                          duplicates.append(value)
                          break
                      if (not country or not prior_country or country == prior_country) and same_event_text(prior_text, value):
                          duplicates.append(value)
                          break
                  else:
                      seen.append((country, value))

          count = len(seen)
          print(f"Today's published-event count: {count}")
          print(f"Eligible source items sent to Gemini: {card.get('source_news_count', 'unknown')}")
          print(f"Semantic duplicate event texts: {len(duplicates)}")
          if count < 1:
              raise SystemExit("Today's card is empty; refusing to publish it.")
          if duplicates:
              raise SystemExit("Card contains semantic duplicate events; refusing to publish it.")
          PY
      - name: Commit and push card
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Publish only the daily-card outputs owned by this workflow.
          # Never stage Python bytecode, temporary files, or unrelated site data.
          git add -A -- daily_cards/cards.json daily_cards/archive/

          if git diff --cached --quiet; then
            echo "No daily-card changes."
          else
            git commit -m "Update daily security card"
            for attempt in 1 2 3; do
              if git fetch origin main && git rebase origin/main && git push origin main; then exit 0; fi
              git rebase --abort || true
              echo "Push attempt $attempt failed; retrying after refreshing main."
              sleep 2
            done
            exit 1
          fi
