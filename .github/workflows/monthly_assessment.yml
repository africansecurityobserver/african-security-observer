name: Generate Monthly Strategic Assessment

on:
  push:
    branches:
      - main
    paths:
      - "monthly_assessment/generate_monthly_assessment.py"
      - ".github/workflows/monthly_assessment.yml"
  schedule:
    # Run on the 8th of each month at 04:00 Tunisia time (03:00 UTC).
    # This allows the final weekly assessment of the previous month to be published first.
    - cron: "0 3 8 * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: monthly-strategic-assessment-${{ github.ref }}
  cancel-in-progress: false

jobs:
  generate-monthly-assessment:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Refresh checkout to latest main
        run: |
          git fetch origin main
          git checkout -B main origin/main
          git reset --hard origin/main
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install google-genai
      - name: Generate monthly assessment
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-3.5-flash-lite
        run: python -u monthly_assessment/generate_monthly_assessment.py
      - name: Commit and publish monthly assessment
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add monthly_assessments/archive/
          if git diff --cached --quiet; then
            echo "No monthly-assessment changes."
          else
            git commit -m "Publish monthly strategic assessment"
            for attempt in 1 2 3; do
              if git pull --rebase origin main && git push origin main; then exit 0; fi
              git rebase --abort || true
              echo "Push attempt $attempt failed; refreshing main."
              sleep 2
            done
            exit 1
          fi
