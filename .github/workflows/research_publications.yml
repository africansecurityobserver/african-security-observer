name: Update Research Center Publications

on:
  push:
    branches:
      - main
    paths:
      - "collect_research_publications.py"
      - ".github/workflows/research_publications.yml"
  schedule:
    - cron: "17 */3 * * *"
      timezone: "Africa/Tunis"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: research-publications-${{ github.ref }}
  cancel-in-progress: false

jobs:
  collect-publications:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Refresh checkout to latest main
        run: |
          git fetch origin main
          git checkout -B main origin/main
          git reset --hard origin/main

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install --upgrade requests deep-translator

      - name: Collect publication titles and source links
        run: python -u collect_research_publications.py

      - name: Commit updated publication list
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research_publications.json
          if git diff --cached --quiet; then
            echo "No publication-list changes."
          else
            git commit -m "Update research center publication links"
            for attempt in 1 2 3; do
              if git pull --rebase origin main && git push origin main; then exit 0; fi
              git rebase --abort || true
              echo "Push attempt $attempt failed; retrying after refreshing main."
              sleep 2
            done
            exit 1
          fi
