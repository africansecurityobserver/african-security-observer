name: Update Research Center Publications

on:
  schedule:
    - cron: "17 */6 * * *"
      timezone: "Africa/Tunis"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect-publications:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install --upgrade requests

      - name: Collect publication titles and source links
        run: python -u collect_research_publications.py

      - name: Commit updated publication list
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research_publications.json
          if git diff --cached --quiet; then
            echo "No publication-list changes."
          else
            git commit -m "Update research center publication links"
            git push
          fi
