name: News Freshness Watchdog

on:
  # Run once when this workflow is edited so its recovery logic can be validated.
  push:
    branches:
      - main
    paths:
      - '.github/workflows/news-freshness-watchdog.yml'
  schedule:
    # Check independently every 10 minutes; GitHub Actions cron schedules use UTC.
    - cron: "3,13,23,33,43,53 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: news-freshness-watchdog
  cancel-in-progress: true

jobs:
  verify-news-updater:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Check updater activity and recover if overdue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json
          import os
          from datetime import datetime, timezone, timedelta
          from urllib.request import Request, urlopen

          repository = os.environ["GITHUB_REPOSITORY"]
          token = os.environ["GH_TOKEN"]
          api_root = f"https://api.github.com/repos/{repository}"
          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {token}",
              "X-GitHub-Api-Version": "2022-11-28",
          }

          def github_json(url, method="GET", payload=None):
              data = json.dumps(payload).encode("utf-8") if payload is not None else None
              request = Request(url, data=data, headers=headers, method=method)
              with urlopen(request, timeout=20) as response:
                  body = response.read()
                  return json.loads(body) if body else {}

          result = github_json(
              f"{api_root}/actions/workflows/update-news.yml/runs?per_page=10"
          )
          runs = result.get("workflow_runs", [])
          active_statuses = {"in_progress", "queued", "waiting", "requested", "pending"}
          active = [run for run in runs if run.get("status") in active_statuses]

          if active:
              print("A news refresh is already queued or running; no duplicate dispatch.")
              raise SystemExit(0)

          latest = max(
              runs,
              key=lambda run: datetime.fromisoformat(
                  run["created_at"].replace("Z", "+00:00")
              ),
              default=None
          )
          now = datetime.now(timezone.utc)
          latest_at = (
              datetime.fromisoformat(latest["created_at"].replace("Z", "+00:00"))
              if latest else None
          )
          age = now - latest_at if latest_at else None
          print(f"Latest news-updater run: {latest_at}")
          print(f"Age of latest run: {age}")

          if age is not None and age <= timedelta(minutes=25):
              print("The news updater has run recently; no recovery needed.")
              raise SystemExit(0)

          print("News updater is overdue; dispatching one recovery run.")
          github_json(
              f"{api_root}/actions/workflows/update-news.yml/dispatches",
              method="POST",
              payload={"ref": "main"},
          )
          print("Recovery dispatch accepted by GitHub Actions.")
          PY
