name: News Freshness Watchdog

on:
  # Run once when this workflow is edited so its recovery logic can be validated.
  push:
    branches:
      - main
    paths:
      - '.github/workflows/news-freshness-watchdog.yml'
  schedule:
    # Check after each scheduled news refresh; recover only if no run started for 40 minutes.
    - cron: "20,50 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: news-freshness-watchdog
  cancel-in-progress: true

jobs:
  verify-news-updater:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Check updater activity and recover if overdue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json
          import os
          from datetime import datetime, timezone, timedelta
          from urllib.request import Request, urlopen

          repository = os.environ["GITHUB_REPOSITORY"]
          token = os.environ["GH_TOKEN"]
          api_root = f"https://api.github.com/repos/{repository}"
          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {token}",
              "X-GitHub-Api-Version": "2022-11-28",
          }

          def github_json(url, method="GET", payload=None):
              data = json.dumps(payload).encode("utf-8") if payload is not None else None
              request = Request(url, data=data, headers=headers, method=method)
              with urlopen(request, timeout=20) as response:
                  body = response.read()
                  return json.loads(body) if body else {}

          result = github_json(
              f"{api_root}/actions/workflows/update-news.yml/runs?per_page=10"
          )
          runs = result.get("workflow_runs", [])
          active_statuses = {"in_progress", "queued", "waiting", "requested", "pending"}
          active = [run for run in runs if run.get("status") in active_statuses]

          if active:
              print("A news refresh is already queued or running; no duplicate dispatch.")
              raise SystemExit(0)

          # The news.json timestamp changes only when its content changes.
          # Use the latest workflow attempt instead, so quiet news periods are not
          # mistaken for a failed scheduler and do not cause repeated dispatches.
          latest = runs[0] if runs else None
          latest_raw = (
              (latest or {}).get("run_started_at")
              or (latest or {}).get("created_at")
          )
          latest_at = (
              datetime.fromisoformat(latest_raw.replace("Z", "+00:00"))
              if latest_raw else None
          )
          now = datetime.now(timezone.utc)
          age = now - latest_at if latest_at else None
          print(f"Latest news workflow run: {latest_at}")
          print(f"Age of latest news workflow attempt: {age}")

          if age is not None and timedelta(0) <= age <= timedelta(minutes=40):
              print("A news refresh was attempted within the 40-minute safety window; no recovery needed.")
              raise SystemExit(0)

          print("No news refresh attempt in the last 40 minutes; dispatching recovery.")
          github_json(
              f"{api_root}/actions/workflows/update-news.yml/dispatches",
              method="POST",
              payload={"ref": "main"},
          )
          print("Recovery dispatch accepted by GitHub Actions.")
          PY
