name: News Freshness Watchdog

on:
  # Run once when this workflow is edited so its recovery logic can be validated.
  push:
    branches:
      - main
    paths:
      - '.github/workflows/news-freshness-watchdog.yml'
  schedule:
    # Check every 10 minutes, staggered away from the hour and the news refresh.
    - cron: "4,14,24,34,44,54 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: news-freshness-watchdog
  cancel-in-progress: true

jobs:
  verify-news-updater:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Check updater activity and recover if overdue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json
          import os
          from datetime import datetime, timezone, timedelta
          from urllib.request import Request, urlopen

          repository = os.environ["GITHUB_REPOSITORY"]
          token = os.environ["GH_TOKEN"]
          api_root = f"https://api.github.com/repos/{repository}"
          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {token}",
              "X-GitHub-Api-Version": "2022-11-28",
          }

          def github_json(url, method="GET", payload=None):
              data = json.dumps(payload).encode("utf-8") if payload is not None else None
              request = Request(url, data=data, headers=headers, method=method)
              with urlopen(request, timeout=20) as response:
                  body = response.read()
                  return json.loads(body) if body else {}

          import base64

          result = github_json(
              f"{api_root}/actions/workflows/update-news.yml/runs?per_page=10"
          )
          runs = result.get("workflow_runs", [])
          active_statuses = {"in_progress", "queued", "waiting", "requested", "pending"}
          active = [run for run in runs if run.get("status") in active_statuses]

          if active:
              print("A news refresh is already queued or running; no duplicate dispatch.")
              raise SystemExit(0)

          # Check the actual publication timestamp, not just the existence of a recent run.
          news_data = github_json(f"{api_root}/contents/news.json?ref=main")
          encoded = news_data.get("content", "")
          if not encoded:
              raise RuntimeError("GitHub returned no content for news.json.")
          news_json = json.loads(base64.b64decode(encoded).decode("utf-8"))
          updated_raw = news_json.get("updated")
          updated_at = (
              datetime.fromisoformat(updated_raw.replace("Z", "+00:00"))
              if updated_raw else None
          )
          now = datetime.now(timezone.utc)
          age = now - updated_at if updated_at else None
          print(f"news.json updated timestamp: {updated_at}")
          print(f"Age of published news data: {age}")

          if age is not None and timedelta(0) <= age <= timedelta(minutes=25):
              print("Published news data is fresh; no recovery needed.")
              raise SystemExit(0)

          print("Published news data is stale or has no valid timestamp; dispatching recovery.")
          github_json(
              f"{api_root}/actions/workflows/update-news.yml/dispatches",
              method="POST",
              payload={"ref": "main"},
          )
          print("Recovery dispatch accepted by GitHub Actions.")
          PY
