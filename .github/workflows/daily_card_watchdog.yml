name: Daily Card Watchdog

on:
  workflow_dispatch:
  schedule:
    # Check 7 minutes after each scheduled digest; compare the exact source packet.
    - cron: "27,57 * * * *"
      timezone: "Africa/Tunis"

permissions:
  contents: read
  actions: write

concurrency:
  group: daily-card-watchdog
  cancel-in-progress: false

jobs:
  check-and-recover:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install the card generator's import dependency
        run: |
          python -m pip install --upgrade pip
          pip install google-genai

      - name: Compare the published card with the current eligible news packet
        id: check
        run: |
          python - <<'PY'
          import json
          import os
          from datetime import datetime
          from pathlib import Path
          from daily_cards.generate_daily_card import (
              TIMEZONE, fingerprint_news_items, get_news_for_period
          )

          now = datetime.now(TIMEZONE)
          today = now.date()
          generation_start = now.replace(hour=6, minute=0, second=0, microsecond=0)
          news_items = get_news_for_period("daily", today)
          current_fingerprint = fingerprint_news_items(news_items) if news_items else ""

          cards_path = Path("daily_cards/cards.json")
          data = json.loads(cards_path.read_text(encoding="utf-8")) if cards_path.exists() else {}
          cards = data.get("cards", []) if isinstance(data, dict) else []
          card = next((
              item for item in reversed(cards)
              if item.get("date") == today.isoformat() and item.get("slot") == "daily"
          ), None)

          event_count = sum(
              1
              for section in (card or {}).get("sections", [])
              for event in section.get("events", [])
              if isinstance(event, dict) and str(event.get("text", "")).strip()
          )
          card_fingerprint = str((card or {}).get("source_fingerprint") or "")
          fingerprint_mismatch = bool(news_items) and card_fingerprint != current_fingerprint
          missing_or_empty = bool(news_items) and (card is None or event_count == 0)
          before_generation_window = now < generation_start
          needs_recovery = (not before_generation_window) and (fingerprint_mismatch or missing_or_empty)

          print(f"Tunisia date: {today.isoformat()}")
          print(f"Generation window started: {not before_generation_window}")
          print(f"Eligible source-news items: {len(news_items)}")
          print(f"Published card events: {event_count}")
          print(f"Card fingerprint matches current news: {bool(card_fingerprint) and card_fingerprint == current_fingerprint}")
          print(f"Recovery needed: {needs_recovery}")

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"needs_recovery={'true' if needs_recovery else 'false'}\n")
          PY

      - name: Avoid duplicate recovery attempts and dispatch if stale
        if: steps.check.outputs.needs_recovery == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          runs_json="$(gh run list --workflow daily_cards.yml --limit 10 --json status,createdAt)"
          python - "$runs_json" <<'PY'
          import json
          import subprocess
          import sys
          from datetime import datetime, timezone

          runs = json.loads(sys.argv[1] or "[]")
          now = datetime.now(timezone.utc)
          active = any(run.get("status") in ("queued", "in_progress") for run in runs)

          latest = None
          for run in runs:
              try:
                  created = datetime.fromisoformat(run["createdAt"].replace("Z", "+00:00"))
                  latest = created if latest is None or created > latest else latest
              except Exception:
                  pass

          recent = latest is not None and (now - latest).total_seconds() < 25 * 60
          should_skip = active or recent
          print(f"Active generation: {active}; attempt within 25 minutes: {recent}")

          if should_skip:
              print("A generation run is active or was attempted recently; avoiding a duplicate dispatch.")
              raise SystemExit(0)

          subprocess.run(
              ["gh", "workflow", "run", "daily_cards.yml", "--ref", "main", "-f", "slot=daily"],
              check=True,
          )
          print("Dispatched recovery because the published card does not match the current eligible news packet.")
          PY
