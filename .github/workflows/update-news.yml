name: Update News

on:
  push:
    branches:
      - main
    paths:
      - 'articles/**'
      - 'images/articles/**'
      - 'build_articles.py'
      - 'update_news.py'
      - 'requirements.txt'
      - 'admin/config.yml'
      - '.github/workflows/update-news.yml'

  schedule:
    # Refresh every 20 minutes; staggered runs leave time for feed collection and publishing.
    - cron: '*/20 * * * *'

  workflow_dispatch:

permissions:
  contents: write

# Prevent scheduled and push-triggered news updates from writing the same JSON files concurrently.
concurrency:
  group: update-news-${{ github.ref }}
  # Never cancel an active feed refresh; allow it to finish and keep one pending run.
  cancel-in-progress: false

jobs:
  update-news:
    runs-on: ubuntu-24.04
    # Keep a stalled refresh from blocking the next scheduled cycle.
    timeout-minutes: 14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Refresh checkout to latest main
        run: |
          git fetch origin main
          git checkout -B main origin/main
          git reset --hard origin/main

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run news quality tests
        run: |
          python -m unittest discover -s tests -v

      - name: Check Python syntax
        run: |
          python -m compileall -q update_news.py build_articles.py daily_cards strategic_cards research_cards monthly_assessment

      - name: Update news
        run: |
          python update_news.py

      - name: Build articles
        run: |
          python build_articles.py

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Python compilation creates local bytecode; never publish it.
          # Remove both tracked and untracked cache files before staging so
          # concurrent runs cannot conflict on binary __pycache__ artifacts.
          find . -type d -name '__pycache__' -prune -exec rm -rf {} +
          find . -type f -name '*.pyc' -delete
          git add -A
          git diff --cached --quiet || git commit -m "Update news and articles"
          for attempt in 1 2 3; do
            if git pull --rebase origin main && git push origin main; then exit 0; fi
            git rebase --abort || true
            echo "Push attempt $attempt failed; retrying after refreshing main."
            sleep 2
          done
          exit 1
