name: Update News

on:
  push:
    branches:
      - main
    paths:
      - 'articles/**'
      - 'images/articles/**'
      - 'build_articles.py'
      - 'update_news.py'
      - 'requirements.txt'
      - 'admin/config.yml'
      - '.github/workflows/update-news.yml'

  schedule:
    - cron: '0 * * * *'

  workflow_dispatch:

permissions:
  contents: write

# Prevent scheduled and push-triggered news updates from writing the same JSON files concurrently.
concurrency:
  group: update-news-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update-news:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Update news
        run: |
          python update_news.py

      - name: Build articles
        run: |
          python build_articles.py

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git diff --cached --quiet || git commit -m "Update news and articles"
          git pull --rebase origin main
          git push origin main
