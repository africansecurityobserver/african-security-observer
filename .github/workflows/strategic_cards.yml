name: Generate Strategic Cards

on:
  # Manual runs remain available; code pushes do not consume Gemini quota.
  workflow_dispatch:

  schedule:
    # Every six hours, Tunisia local time; offset to avoid the top of the hour.
    - cron: "17 0,6,12,18 * * *"
      timezone: "Africa/Tunis"

permissions:
  contents: write

# Prevent overlapping strategic-news runs from racing to update the same JSON files.
concurrency:
  group: strategic-news-cards-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate-strategic-card:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Refresh checkout to latest main
        run: |
          git fetch origin main
          git checkout -B main origin/main
          git reset --hard origin/main

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install the same Gemini and extraction libraries used by the news project
        run: |
          python -m pip install --upgrade pip
          pip install google-genai requests selectolax googlenewsdecoder

      - name: Generate strategic card
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-3.5-flash-lite
          CARD_SLOT: news
          MAX_CARDS_PER_RUN: "1"
        run: |
          python -u strategic_cards/generate_strategic_cards.py

      - name: Commit and publish generated cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add strategic_cards.json strategic_cards/archive/

          if git diff --cached --quiet; then
            echo "No strategic-card changes to commit."
          else
            git commit -m "Update event-driven strategic news cards"
            # Other site workflows may commit while this job is generating cards.
            # Rebase on the newest main before pushing to avoid a stale-branch push failure.
            for attempt in 1 2 3; do
              if git pull --rebase origin main && git push origin main; then exit 0; fi
              git rebase --abort || true
              echo "Push attempt $attempt failed; retrying after refreshing main."
              sleep 2
            done
            exit 1
          fi
