name: Generate Strategic Cards

on:
  workflow_dispatch:

  schedule:
    # One run per day, after the hourly news collection has refreshed.
    - cron: "30 7 * * *"
      timezone: "Africa/Tunis"

permissions:
  contents: write

jobs:
  generate-strategic-card:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install the same Gemini and extraction libraries used by the news project
        run: |
          python -m pip install --upgrade pip
          pip install google-genai requests selectolax

      - name: Generate strategic card
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-3.5-flash-lite
        run: |
          python -u strategic_cards/generate_strategic_cards.py

      - name: Commit and publish generated cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add strategic_cards.json strategic_cards/archive/

          if git diff --cached --quiet; then
            echo "No strategic-card changes to commit."
          else
            git commit -m "Generate strategic arms and military systems card"
            git push
          fi
