name: Generate Strategic Cards

on:
  workflow_dispatch:
    inputs:
      slot:
        description: "Choose which daily strategic card to generate"
        required: true
        type: choice
        options:
          - morning
          - evening
        default: morning

  schedule:
    # Morning card: publish at 08:55 Tunis time.
    - cron: "55 8 * * *"
      timezone: "Africa/Tunis"
    # Evening card: articles published 09:01–23:50, published at 23:55 Tunis time.
    - cron: "55 23 * * *"
      timezone: "Africa/Tunis"

permissions:
  contents: write

jobs:
  generate-strategic-card:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install the same Gemini and extraction libraries used by the news project
        run: |
          python -m pip install --upgrade pip
          pip install google-genai requests selectolax

      - name: Generate strategic card
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-3.5-flash-lite
          CARD_SLOT: ${{ github.event_name == 'workflow_dispatch' && inputs.slot || (github.event.schedule == '55 23 * * *' && 'evening' || 'morning') }}
        run: |
          python -u strategic_cards/generate_strategic_cards.py

      - name: Commit and publish generated cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add strategic_cards.json strategic_cards/archive/

          if git diff --cached --quiet; then
            echo "No strategic-card changes to commit."
          else
            git commit -m "Generate ${{ github.event_name == 'workflow_dispatch' && inputs.slot || (github.event.schedule == '55 23 * * *' && 'evening' || 'morning') }} strategic analysis card"
            git push
          fi
