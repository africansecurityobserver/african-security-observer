name: Generate Strategic Cards

on:
  # Run a validation/generation pass when the generator or its schedule changes.
  push:
    paths:
      - "strategic_cards/generate_strategic_cards.py"
      - ".github/workflows/strategic_cards.yml"
  workflow_dispatch:

  schedule:
    # Check for new major news and defense/arms stories every 30 minutes.
    - cron: "*/30 * * * *"

permissions:
  contents: write

# Prevent overlapping strategic-news runs from racing to update the same JSON files.
concurrency:
  group: strategic-news-cards-${{ github.ref }}
  cancel-in-progress: false

jobs:
  generate-strategic-card:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install the same Gemini and extraction libraries used by the news project
        run: |
          python -m pip install --upgrade pip
          pip install google-genai requests selectolax googlenewsdecoder

      - name: Generate strategic card
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-3.5-flash-lite
          CARD_SLOT: news
        run: |
          python -u strategic_cards/generate_strategic_cards.py

      - name: Commit and publish generated cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add strategic_cards.json strategic_cards/archive/

          if git diff --cached --quiet; then
            echo "No strategic-card changes to commit."
          else
            git commit -m "Update event-driven strategic news cards"
            # Other site workflows may commit while this job is generating cards.
            # Rebase on the newest main before pushing to avoid a stale-branch push failure.
            for attempt in 1 2 3; do
              git pull --rebase origin main && git push origin main && exit 0
              echo "Push attempt $attempt failed; retrying after refreshing main."
              sleep 2
            done
            exit 1
          fi
